[tox]
envlist = py3{10,11,12,13,14},lint
# No default pyproject.toml build — use PYTHONPATH for now
# until meson-python migration (Phase 6)
requires =
    tox-uv>=1.0

[testenv]
# Skip install — pymvpa2 doesn't have a working pyproject.toml yet.
# We use PYTHONPATH instead.
skip_install = true
deps =
    numpy
    scipy
    h5py
    scikit-learn
    joblib
    pytest
set_env =
    PYTHONPATH = {toxinidir}
    # Disable labile (flaky) tests — they are seed-dependent numerical
    # edge cases, not regressions.  Run with MVPA_TESTS_LABILE=yes to
    # include them.
    MVPA_TESTS_LABILE = {env:MVPA_TESTS_LABILE:no}
commands =
    # Test directories matching submodule layout.
    # Ignores: C extensions (SVM), HDF5 deep work, inspect.getargspec
    # (removed in PY3.11+), yield-based tests, nibabel/openfmri-deps.
    pytest {posargs:\
        mvpa2/algorithms/tests \
        mvpa2/base/tests \
        mvpa2/clfs/tests \
        mvpa2/datasets/tests \
        mvpa2/generators/tests \
        mvpa2/kernels/tests \
        mvpa2/mappers/tests \
        mvpa2/measures/tests \
        mvpa2/misc/tests \
        mvpa2/support/tests \
        --ignore=mvpa2/base/tests/test_hdf5.py \
        --ignore=mvpa2/clfs/tests/test_svm.py \
        --ignore=mvpa2/datasets/tests/test_erdataset.py \
        --ignore=mvpa2/datasets/tests/test_giftidataset.py \
        --ignore=mvpa2/datasets/tests/test_niftidataset.py \
        --ignore=mvpa2/datasets/tests/test_openfmri.py \
        --ignore=mvpa2/mappers/tests/test_mapper.py \
        --ignore=mvpa2/misc/tests/test_dcov.py \
        -q \
    }

[testenv:lint]
# Lightweight syntax/style check.  Full ruff config arrives with
# pyproject.toml in Phase 6; for now we only run the syntax-error
# subset so the CI lint env stays fast and noise-free.
skip_install = true
deps =
    ruff
commands =
    ruff check --select=E9,F63,F7,F82 mvpa2/
