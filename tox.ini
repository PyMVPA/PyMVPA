[tox]
envlist = py3
# No default pyproject.toml build — use PYTHONPATH for now
# until meson-python migration (Phase 6)
requires =
    tox-uv>=1.0

[testenv]
# Skip install — pymvpa2 doesn't have a working pyproject.toml yet.
# We use PYTHONPATH instead.
skip_install = true
deps =
    numpy
    scipy
    h5py
    scikit-learn
    joblib
    pytest
    # Temporary — needed until future/six stripped in Phase 2
    future
    six
set_env =
    PYTHONPATH = {toxinidir}
commands =
    # Phase 1 verified test directories.
    # Tests requiring C extensions (SVM) or deep HDF5 work are excluded.
    # As more modules are migrated, add their test dirs here and remove
    # corresponding --ignore entries.
    pytest {posargs:\
        mvpa2/algorithms/tests \
        mvpa2/base/tests \
        mvpa2/clfs/tests \
        mvpa2/kernels/tests \
        mvpa2/measures/tests \
        mvpa2/misc/tests \
        mvpa2/support/tests \
        --ignore=mvpa2/base/tests/test_hdf5.py \
        --ignore=mvpa2/clfs/tests/test_svm.py \
        --ignore=mvpa2/misc/tests/test_dcov.py \
        -q \
    }
